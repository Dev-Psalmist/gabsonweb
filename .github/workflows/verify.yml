name: Verify Gabson

on:
  push:
    branches: [migration/base44-free]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download original Gabson image files
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          data_path = Path("src/components/site/data.js")
          source = data_path.read_text()
          target = Path("public/images")
          target.mkdir(parents=True, exist_ok=True)
          if "media.base44.com" not in source and "${MEDIA}" not in source and "${UPLOADS}" not in source:
              existing = list(target.glob("*"))
              if len(existing) < 40 or "/images/" not in source:
                  raise SystemExit("The local image migration is incomplete.")
              print(f"Original assets are already local: {len(existing)} files.")
          else:
              roots = {
                  "MEDIA": "https://media.base44.com/images/public/user_6afe1bcde98e1e348ba0da18",
                  "UPLOADS": "https://media.base44.com/images/public/6b06f05c7525e90c5a9bfa73",
              }
              matches = re.findall(r'\$\{(MEDIA|UPLOADS)\}/([^\x60]+)', source)
              assets = {}
              for root, filename in matches:
                  filename = filename.strip()
                  if filename.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".gif")):
                      assets[filename] = roots[root] + "/" + filename
              if not assets:
                  raise SystemExit("No original Gabson image files were found in data.js.")

              for filename, url in assets.items():
                  print(f"Downloading {filename}", flush=True)
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      content_type = response.headers.get("Content-Type", "")
                      payload = response.read()
                  if not content_type.startswith("image/") or len(payload) < 128:
                      raise RuntimeError(f"Invalid image response for {filename}: {content_type}, {len(payload)} bytes")
                  (target / filename).write_bytes(payload)
                  print(f"Saved {filename}: {len(payload)} bytes", flush=True)

              source = re.sub(r'^const MEDIA = .*?;\n', '', source, count=1, flags=re.M)
              source = re.sub(r'^const UPLOADS =\n  .*?;\n', '', source, count=1, flags=re.M)
              source = source.replace("${MEDIA}/", "/images/").replace("${UPLOADS}/", "/images/")
              if "media.base44.com" in source or "${MEDIA}" in source or "${UPLOADS}" in source:
                  raise SystemExit("Base44 media references remain after asset rewrite.")
              data_path.write_text(source)
              print(f"Successfully extracted {len(assets)} original Gabson assets.")

          PY

      - name: Commit migrated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/components/site/data.js
          if ! git diff --cached --quiet; then
            git commit -m "assets: move original Gabson images off Base44 CDN"
            for attempt in 1 2 3; do
              git push && exit 0
              echo "Push attempt $attempt failed; retrying..."
              sleep 8
            done
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Lint
        run: npm run lint
