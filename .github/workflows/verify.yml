name: Verify Gabson

on:
  push:
    branches: [migration/base44-free]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Download original public Gabson images and move references locally
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          data_path = Path("src/components/site/data.js")
          source = data_path.read_text()
          media = "https://media.base44.com/images/public/user_6afe1bcde98e1e348ba0da18"
          uploads = "https://media.base44.com/images/public/6b06f05c7525e90c5a9bfa73"
          resolved = source.replace("${MEDIA}", media).replace("${UPLOADS}", uploads)
          urls = sorted(set(re.findall(r"https://media\.base44\.com/images/public/[^\s\x60\"']+", resolved)))
          if not urls:
              raise SystemExit("No original Base44 image URLs were found; refusing to make an empty asset migration.")

          target = Path("public/images")
          target.mkdir(parents=True, exist_ok=True)
          for url in urls:
              filename = url.rsplit("/", 1)[-1]
              request = urllib.request.Request(url, headers={"User-Agent": "Gabson-Asset-Migration/1.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  content_type = response.headers.get("Content-Type", "")
                  if not content_type.startswith("image/"):
                      raise RuntimeError(f"Unexpected content type for {filename}: {content_type}")
                  payload = response.read()
              if len(payload) < 128:
                  raise RuntimeError(f"Image response was unexpectedly small: {filename}")
              (target / filename).write_bytes(payload)
              print(f"Downloaded {filename} ({len(payload)} bytes)")

          # Replace Base44 CDN roots with local, project-owned public asset paths.
          source = re.sub(r'^const MEDIA = .*?;\n', '', source, count=1, flags=re.M)
          source = re.sub(r'^const UPLOADS =\n  .*?;\n', '', source, count=1, flags=re.M)
          source = source.replace("${MEDIA}/", "/images/").replace("${UPLOADS}/", "/images/")
          if "media.base44.com" in source or "${MEDIA}" in source or "${UPLOADS}" in source:
              raise SystemExit("A Base44 media reference remains in data.js; refusing to commit an incomplete migration.")
          data_path.write_text(source)
          print(f"Successfully migrated {len(urls)} original image assets.")
          PY

      - name: Commit migrated original assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images src/components/site/data.js
          if ! git diff --cached --quiet; then
            git commit -m "assets: move original Gabson images off Base44 CDN"
            git push
          else
            echo "Assets already migrated; no asset commit needed."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Lint
        run: npm run lint
